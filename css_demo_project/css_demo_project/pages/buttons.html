
<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Buttons Collection</title>
<link rel="stylesheet" href="../css/shared.css">
<style>
.btn-row { display:flex; gap:16px; align-items:center; }
.button { padding:10px 16px; border-radius:10px; cursor:pointer; border:none; transition: transform 0.18s ease, box-shadow 0.18s ease; box-shadow:0 6px 18px rgba(2,6,23,0.08); }
.button.primary { background:#2563eb; color:#fff; }
.button.secondary { background:#64748b; color:#fff; }
.button.outline { background:transparent; border:2px solid #94a3b8; color:#0f172a; }
.button:focus { outline:3px solid rgba(59,130,246,0.2); }
.button:hover { transform:translateY(-3px); box-shadow:0 12px 30px rgba(2,6,23,0.12); }
.button:active { transform:translateY(0) scale(0.98); }
button:disabled, .button.disabled { opacity:0.45; cursor:not-allowed; transform:none; box-shadow:none; }
</style>
</head><body>
<div class="container">
<header><h1>Button Styles</h1><small class="note">Primary, Secondary, Outline and Disabled examples. Try tabbing to see :focus.</small></header>

<div class="btn-row" role="group" aria-label="Buttons">
  <button class="button primary">Primary</button>
  <button class="button secondary">Secondary</button>
  <button class="button outline">Outline</button>
  <button class="button disabled" disabled>Disabled</button>
</div>

<footer style="margin-top:16px;">Uses padding, border-radius, shadows, hover/active transitions, and clear :focus/:disabled states.</footer>
</div>
</body></html>
