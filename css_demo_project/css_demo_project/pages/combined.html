
<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Combined Effects</title>
<link rel="stylesheet" href="../css/shared.css">
<style>
.examples { display:flex; gap:18px; align-items:center; justify-content:center; flex-wrap:wrap; }
.example { padding:12px 16px; border-radius:10px; border:none; cursor:pointer; transition: transform 0.22s ease, box-shadow 0.22s ease, background 0.22s ease; box-shadow:0 8px 20px rgba(2,6,23,0.06); }
.example:hover { transform:scale(1.06); box-shadow:0 18px 40px rgba(2,6,23,0.12); }
.example:active { transform:scale(0.99) translateY(1px); }
.example.primary { background:#06b6d4; color:#04263b; }
.example.ghost { background:transparent; border:1px solid #cbd5e1; }
.example:focus { outline:3px solid rgba(6,182,212,0.18); }
</style>
</head><body>
<div class="container">
<header><h1>Combined Effects</h1></header>

<div class="examples">
  <button class="example primary">Grow & Color</button>
  <button class="example ghost">Outline Grow</button>
  <a class="example" href="#" style="background:#f97316;color:white;border-radius:8px; padding:10px 14px;">Link Button</a>
</div>

<footer style="margin-top:18px;">These elements combine pseudo-classes, transformations and transitions to create balanced effects.</footer>
</div>
</body></html>
