
<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Mini UI Layout</title>
<link rel="stylesheet" href="../css/shared.css">
<style>
:root { --card-w: 920px; }
.app { display:flex; min-height:80vh; align-items:center; justify-content:center; padding:20px; }
.app-card { width:100%; max-width:var(--card-w); border-radius:14px; padding:18px; box-shadow:0 18px 50px rgba(2,6,23,0.08); background:linear-gradient(180deg,#ffffff,#f8fafc); }
.header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
.form-row { display:flex; gap:10px; align-items:center; }
.form-row input, .form-row select { padding:10px; border-radius:8px; border:1px solid #e6eef8; }
.small-img { width:64px; height:64px; border-radius:8px; object-fit:cover; }
.footer { margin-top:12px; text-align:center; color:#475569; }
</style>
</head><body>
<div class="container app">
  <div class="app-card">
    <div class="header">
      <h2>Mini Interface</h2>
      <img src="../images/img1.svg" alt="logo" class="small-img">
    </div>
    <form>
      <div class="form-row">
        <input type="text" placeholder="Full name" aria-label="Full name">
        <input type="email" placeholder="name@example.com" aria-label="email">
        <select><option>Student</option><option>Professional</option></select>
        <button class="btn" type="submit">Submit</button>
      </div>
    </form>

    <div style="margin-top:14px;">
      <button class="btn" style="background:#2563eb;color:white;">Primary action</button>
      <button class="btn" style="background:#94a3b8;color:white;">Secondary</button>
    </div>

    <footer class="footer">Footer — compact layout, consistent box-sizing, shadows and hover/focus states.</footer>
  </div>
</div>
</body></html>
