
<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Animations</title>
<link rel="stylesheet" href="../css/shared.css">
<style>
.center { min-height:70vh; flex-direction:column; gap:24px; }
.anim-row { display:flex; gap:24px; align-items:center; justify-content:center; }
.box { width:90px; height:90px; border-radius:10px; display:flex; align-items:center; justify-content:center; color:white; font-weight:700; }

/* moving box */
@keyframes slideX { from { transform:translateX(-0%);} 50% { transform:translateX(24px);} to { transform:translateX(-0%);} }

/* bouncing */
@keyframes bounce {
  0% { transform:translateY(0); }
  50% { transform:translateY(-30px); }
  100% { transform:translateY(0); }
}

/* color change */
@keyframes colorShift { 0%{background:#ef4444} 50%{background:#f59e0b} 100%{background:#ef4444} }

.box.slide { background:#4f46e5; animation: slideX 2s ease-in-out infinite; animation-direction: alternate; }
.box.bounce { background:#10b981; animation: bounce 1.2s ease-in-out infinite; animation-iteration-count: infinite; animation-delay: 0.12s; }
.box.color { background:#ef4444; animation: colorShift 3s ease-in-out infinite; animation-direction: alternate; }

</style>
</head><body>
<div class="container center">
<header><h1>CSS Animations</h1><small class="note">Three examples using @keyframes, delays, iteration counts and direction.</small></header>

<div class="anim-row">
  <div class="box slide">Slide</div>
  <div class="box bounce">Bounce</div>
  <div class="box color">Color</div>
</div>

<footer style="margin-top:20px;">Animations use <code>animation-delay</code>, <code>animation-iteration-count</code>, and <code>animation-direction</code> to control behavior. All use ease-in-out for smoothness.</footer>
</div>
</body></html>
